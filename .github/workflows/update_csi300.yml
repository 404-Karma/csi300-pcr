name: Daily Update CSI300 PCR

on:
  schedule:
    # 北京时间每天 18:00（UTC 10:00）
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare==1.18.55 pandas numpy requests matplotlib

      - name: Run CSI300 PCR updater
        run: python csi300_pcr_analyzer.py 730

      - name: Commit and push updated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add csi300_pcr_output/
          git diff --cached --quiet || (git commit -m "Auto update CSI300 PCR data $(date +%Y-%m-%d)" && git push)
